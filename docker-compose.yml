services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    image: hackguard-backend:local
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hackguard_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hackguard_test
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    image: hackguard-backend:local
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hackguard_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hackguard_test
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      WORKSPACE_ROOT: /workspace
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - sandbox_workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    image: hackguard-backend:local
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hackguard_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hackguard_test
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /workspace
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - sandbox_workspace:/workspace
      # Docker-outside-of-Docker (Phase 5): the worker talks to the HOST
      # daemon to spawn sandbox containers as siblings, never nested/privileged.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Must stay host-reachable: this is shipped to the BROWSER, which runs
      # on the host, not inside the compose network - "api" (the service
      # name) would not resolve there.
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  sandbox_workspace:
